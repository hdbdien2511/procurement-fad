# Nginx đứng trước gunicorn: kết thúc TLS, phục vụ tệp tĩnh, giới hạn tần suất trang đăng nhập.
# Tệp này được mount vào /etc/nginx/conf.d/default.conf (nằm trong ngữ cảnh `http`).
#
# Nguyên tắc: nginx KHÔNG phục vụ MEDIA_ROOT. Chứng từ chỉ tải về qua tầng ứng dụng để kiểm tra
# quyền của từng người dùng (xem apps/documents). Vì vậy ở đây không có `location /media`.

# Giới hạn tần suất cho trang đăng nhập: 10 yêu cầu/phút/địa chỉ IP (django-axes khoá tài khoản sau
# 5 lần sai; lớp này chặn thử mật khẩu tự động trước khi tới ứng dụng).
limit_req_zone $binary_remote_addr zone=dangnhap:10m rate=10r/m;
limit_req_status 429;

upstream procurement_app {
    server app:8000;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Header bảo mật (ứng dụng cũng tự đặt; đặt ở đây để bảo vệ cả trang lỗi do nginx sinh ra).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Chứng từ tối đa 25 MB + phần bao của form multipart.
    client_max_body_size 26m;
    client_body_timeout 60s;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Header chuyển tiếp (các location bên dưới kế thừa). TRUSTED_PROXY_COUNT=1 trong .env.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Tệp tĩnh lấy từ volume `static` (do collectstatic sinh ra), không qua gunicorn.
    location /static/ {
        alias /usr/share/nginx/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        # add_header trong location thay thế toàn bộ header của server: khai báo lại đủ bộ.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://procurement_app;
    }

    location /dang-nhap/ {
        limit_req zone=dangnhap burst=5 nodelay;
        proxy_pass http://procurement_app;
    }

    location / {
        proxy_pass http://procurement_app;
    }
}
