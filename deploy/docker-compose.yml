# Bộ dịch vụ chạy hệ thống mua sắm trên một máy chủ nội bộ Ubuntu 26.04.
# Biến môi trường lấy từ tệp `.env` cạnh tệp này (do `scripts/install.sh` sinh ra). `.env` KHÔNG
# được nạp thẳng vào container: mỗi dịch vụ chỉ nhận đúng những biến nó cần (xem `x-app-env`), nhờ
# vậy mật khẩu của role sở hữu schema không có trong môi trường của ứng dụng.
# Mọi lệnh nên chạy qua scripts/ (install, upgrade, backup, restore) để dùng đúng tệp compose.
name: procurement

# Biến môi trường của `app` và `worker`. KHÔNG bao giờ thêm DB_OWNER_* / DATABASE_URL_OWNER vào
# đây: role sở hữu schema (và là superuser của cụm dữ liệu) chỉ được dùng từ máy chủ qua
# `docker compose run -e DATABASE_URL` khi chạy migrate / apply_db_grants.
x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.prod}
  SECRET_KEY: ${SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  SITE_URL: ${SITE_URL}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
  DATABASE_URL: ${DATABASE_URL}
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-1}
  OIDC_RP_CLIENT_ID: ${OIDC_RP_CLIENT_ID:-}
  OIDC_RP_CLIENT_SECRET: ${OIDC_RP_CLIENT_SECRET:-}
  OIDC_OP_TENANT_ID: ${OIDC_OP_TENANT_ID:-}

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_OWNER_USER}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      # init.sql đọc hai biến này để tạo role runtime ở lần khởi tạo cụm dữ liệu đầu tiên.
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      # POSTGRES_USER/POSTGRES_DB là biến do chính ảnh postgres đặt trong container (xem environment).
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    shm_size: 256mb
    mem_limit: 1g
    cpus: 2.0
    logging: *logging

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: procurement-app:latest
    restart: unless-stopped
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"
    mem_limit: 1g
    cpus: 2.0
    logging: *logging

  worker:
    # Cùng ảnh với `app` (khai lại build để `docker compose pull --ignore-buildable` bỏ qua dịch vụ này).
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: procurement-app:latest
    restart: unless-stopped
    command: ["python", "src/manage.py", "run_worker"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - media:/app/media
    healthcheck:
      disable: true
    mem_limit: 512m
    cpus: 1.0
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      # 80 chỉ để chuyển hướng sang HTTPS (xem nginx.conf), toàn bộ ứng dụng chạy trên 443.
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # Chỉ tệp tĩnh được phục vụ trực tiếp; MEDIA_ROOT (chứng từ) không bao giờ mount vào nginx.
      - static:/usr/share/nginx/static:ro
    mem_limit: 256m
    cpus: 1.0
    logging: *logging

volumes:
  pgdata:
  media:
  static:
