{% extends "accounts/_base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<h1>Đăng nhập</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Đăng nhập</button>
</form>
{% if oidc_enabled %}<p><a href="{% url 'oidc_authentication_init' %}">Đăng nhập bằng tài khoản Microsoft</a></p>{% endif %}
{% endblock %}
